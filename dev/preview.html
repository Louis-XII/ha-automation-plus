<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>AutomationPlus — Preview</title>
  <style>
    /* Variables CSS Home Assistant (thème par défaut) — reproduites ici pour
       que le panel s'affiche comme dans une vraie instance HA, sans HA. */
    :root {
      --primary-color: #03a9f4;
      --primary-text-color: #212121;
      --secondary-text-color: #727272;
      --card-background-color: #fff;
      --primary-background-color: #fafafa;
      --secondary-background-color: #e5e5e5;
      --divider-color: #e0e0e0;
      color-scheme: light;
    }
    body {
      margin: 0;
      font-family: sans-serif;
      background: var(--primary-background-color);
    }
    automation-plus-panel {
      display: block;
      height: 100vh;
    }
  </style>
</head>
<body>
  <automation-plus-panel></automation-plus-panel>

  <script src="../custom_components/automation_plus/frontend/automation-panel.js"></script>
  <script>
    // hass factice — HA pose normalement ces propriétés directement en JS,
    // pas via attributs HTML, d'où cette simulation identique côté preview.
    const mockHass = {
      states: {
        "automation.lumieres_salon": { entity_id: "automation.lumieres_salon", state: "on" },
        "automation.arrosage_jardin": { entity_id: "automation.arrosage_jardin", state: "off" },
        "automation.alerte_porte": { entity_id: "automation.alerte_porte", state: "on" },
      },
    };

    const panel = document.querySelector("automation-plus-panel");
    panel.hass = mockHass;
    panel.narrow = false;
  </script>
</body>
</html>
